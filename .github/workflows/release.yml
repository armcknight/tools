name: release

# Delegates to armcknight/workflows' reusable SwiftPM cask-release pipeline:
# builds, (optionally signs+notarizes), tarballs the binaries, publishes to the
# armcknight/homebrew-tools tap, and bumps Casks/tools.rb (or tools-rc.rb for an
# RC tag). Requires TAP_RELEASE_TOKEN (Contents: read+write on the tap).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    uses: armcknight/workflows/.github/workflows/swiftpm-cask-release.yml@1
    with:
      cask-name: tools
      binaries: |
        changetag
        inject-git-info
        migrate-changelog
        ota-publish
        prepare-github-release
        prepare-release
        psst
        read-changelog
        spm-acknowledgements
        tag-icons
        upload-symbols
        vrsn
        xcbs
      version-file: Sources/Shared/Version.swift
      version-regex: '.*toolsVersion.*"([^"]+)".*'
    secrets: inherit
