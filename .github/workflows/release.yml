name: release

# Delegates to armcknight/workflows' reusable SwiftPM cask-release pipeline:
# builds, signs+notarizes, tarballs the binaries, publishes to the
# armcknight/homebrew-tools tap, and bumps Casks/tools.rb (or tools-rc.rb for an
# RC tag). Requires TAP_RELEASE_TOKEN (Contents: read+write on the tap). Signing
# reads the Developer ID certificate from the fastlane match repo (readonly), so
# it also needs the MATCH_PASSWORD + MATCH_DEPLOY_KEY and NOTARY_* secrets.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    uses: armcknight/workflows/.github/workflows/swiftpm-cask-release.yml@2
    with:
      cask-name: tools
      binaries: |
        changetag
        check-release-ready
        inject-git-info
        migrate-changelog
        ota-publish
        prepare-github-release
        prepare-release
        psst
        read-changelog
        spm-acknowledgements
        tag-icons
        upload-symbols
        vrsn
        xcbs
      version-file: Sources/Shared/Version.swift
      version-regex: '.*toolsVersion.*"([^"]+)".*'
      sign: true
      match-git-url: git@github.com:armcknight/fastlane-match.git
      team-id: 29274SF4VL
      bundle-id: io.mcknight.tools
    secrets: inherit
